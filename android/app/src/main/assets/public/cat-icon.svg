<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E8" />
      <stop offset="50%" stop-color="#FFE8F3" />
      <stop offset="100%" stop-color="#E4E0FF" />
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB37C" />
      <stop offset="100%" stop-color="#F99446" />
    </linearGradient>
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA8C5" />
      <stop offset="100%" stop-color="#FF759E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E882A5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for Android -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Cute Ring -->
  <circle cx="256" cy="256" r="210" fill="#FFFFFF" opacity="0.6" />
  
  <g filter="url(#shadow)">
    <!-- Cat Ears -->
    <path d="M 140 180 L 175 60 L 235 150 Z" fill="url(#catGrad)" />
    <path d="M 155 170 L 180 85 L 220 145 Z" fill="url(#earPink)" />
    
    <path d="M 372 180 L 337 60 L 277 150 Z" fill="url(#catGrad)" />
    <path d="M 357 170 L 332 85 L 292 145 Z" fill="url(#earPink)" />

    <!-- Cat Head & Body -->
    <ellipse cx="256" cy="280" rx="145" ry="130" fill="url(#catGrad)" />
    
    <!-- White Muzzle Patch -->
    <ellipse cx="256" cy="320" rx="65" ry="45" fill="#FFFFFF" />

    <!-- Cute Eyes -->
    <ellipse cx="195" cy="255" rx="18" ry="24" fill="#2D2B38" />
    <circle cx="190" cy="247" r="7" fill="#FFFFFF" />
    <circle cx="203" cy="263" r="3.5" fill="#FFFFFF" />

    <ellipse cx="317" cy="255" rx="18" ry="24" fill="#2D2B38" />
    <circle cx="312" cy="247" r="7" fill="#FFFFFF" />
    <circle cx="325" cy="263" r="3.5" fill="#FFFFFF" />

    <!-- Blushing Pink Cheeks -->
    <ellipse cx="160" cy="285" rx="22" ry="14" fill="#FF8BA7" opacity="0.75" />
    <ellipse cx="352" cy="285" rx="22" ry="14" fill="#FF8BA7" opacity="0.75" />

    <!-- Cute Triangle Nose -->
    <polygon points="256,298 246,288 266,288" fill="#FF6584" />

    <!-- W-Mouth (Kawaii smile) -->
    <path d="M 246 298 Q 236 312 224 305" stroke="#4A3B32" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 266 298 Q 276 312 288 305" stroke="#4A3B32" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Cute Whiskers -->
    <line x1="150" y1="270" x2="80" y2="260" stroke="#7A583A" stroke-width="3.5" stroke-linecap="round" />
    <line x1="150" y1="290" x2="80" y2="295" stroke="#7A583A" stroke-width="3.5" stroke-linecap="round" />
    
    <line x1="362" y1="270" x2="432" y2="260" stroke="#7A583A" stroke-width="3.5" stroke-linecap="round" />
    <line x1="362" y1="290" x2="432" y2="295" stroke="#7A583A" stroke-width="3.5" stroke-linecap="round" />

    <!-- Cute Bell Collar -->
    <path d="M 170 380 Q 256 420 342 380" stroke="#FF4D6D" stroke-width="14" stroke-linecap="round" fill="none" />
    <circle cx="256" cy="405" r="18" fill="#FFD166" />
    <circle cx="256" cy="405" r="14" fill="#FFEAA7" />
    <circle cx="256" cy="410" r="3.5" fill="#B38F00" />
    <line x1="242" y1="405" x2="270" y2="405" stroke="#B38F00" stroke-width="2" />
  </g>

  <!-- Sparkles -->
  <path d="M 100 130 Q 100 145 85 145 Q 100 145 100 160 Q 100 145 115 145 Q 100 145 100 130 Z" fill="#FFC048" />
  <path d="M 410 130 Q 410 145 395 145 Q 410 145 410 160 Q 410 145 425 145 Q 410 145 410 130 Z" fill="#FF6B8B" />
  <path d="M 390 380 Q 390 392 378 392 Q 390 392 390 404 Q 390 392 402 392 Q 390 392 390 380 Z" fill="#9C88FF" />
</svg>
